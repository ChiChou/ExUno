# Builds the language packs from the pinned public sources and publishes them
# as the "packs" release, so contributors can skip the local data build.
name: Language packs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Scripts/**"
      - ".github/workflows/packs.yml"

permissions:
  contents: write

concurrency:
  group: packs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download, verify and build
        run: sh Scripts/prepare_data.sh

      - name: Bundle packs with their licenses
        run: |
          mkdir -p dist/exuno-packs
          cp ExUno/Resources/Packs/*.json dist/exuno-packs/
          cp ATTRIBUTIONS.md dist/exuno-packs/
          cp -R LICENSES dist/exuno-packs/
          cat > dist/exuno-packs/README.md <<'NOTE'
          # Ex Uno language packs

          Generated by Scripts/prepare_data.sh from https://github.com/${{ github.repository }} at ${{ github.sha }}.
          The packs are licensed under CC BY-SA 4.0 (LICENSES/CC-BY-SA-4.0.txt). Sources and required notices: ATTRIBUTIONS.md.
          NOTE
          cd dist
          zip -qr exuno-packs.zip exuno-packs
          shasum -a 256 exuno-packs.zip > exuno-packs.zip.sha256
          cat exuno-packs.zip.sha256

      - name: Publish the "packs" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Prebuilt language packs (CC BY-SA 4.0) from ${GITHUB_SHA}. Install with: sh Scripts/download_packs.sh"
          if gh release view packs >/dev/null 2>&1; then
            gh release edit packs --notes "$notes"
          else
            gh release create packs --title "Language packs" --notes "$notes" --latest=false
          fi
          gh release upload packs dist/exuno-packs.zip dist/exuno-packs.zip.sha256 --clobber
